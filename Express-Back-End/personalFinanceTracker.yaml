      RestApiId: !Ref ApiGatewayRestApi

  EntriesUpdateByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref EntriesUpdateResource
      PathPart: "{id}"
      RestApiId: !Ref ApiGatewayRestApi

  EntriesDeleteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref EntriesResource
      PathPart: delete
      RestApiId: !Ref ApiGatewayRestApi

  EntriesDeleteByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref EntriesDeleteResource
      PathPart: "{id}"
      RestApiId: !Ref ApiGatewayRestApi

  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: auth
      RestApiId: !Ref ApiGatewayRestApi

  AuthLoginResource:
