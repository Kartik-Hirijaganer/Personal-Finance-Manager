AWSTemplateFormatVersion: "2010-09-09"
Description: Personal Finance Tracker template version 1.0.0
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "API Configuration"
        Parameters:
          - StageName
          - LambdaExecutionRole
Parameters:
  StageName:
    Type: String
    Default: "V0"
    Description: Name of the API stage
  LambdaExecutionRole:
    Type: String
    Description: ARN of the Lambda execution role
  SecretKey:
    Type: String
    Description: Secret Key
  ConnectionUrl:
    Type: String
    Description: MongoDB Connection URL

Resources:
  UserLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: userService.handler
      FunctionName: userService
      Description: User service lambda function
      MemorySize: 128
      PackageType: Zip
      Role: !Ref LambdaExecutionRole
      Environment:
        Variables:
          CONNECTION_URL: !Ref ConnectionUrl
      Code:
        S3Bucket: all-lambda-functions-v1
        S3Key: userService.zip
      Runtime: nodejs16.x
      Timeout: 25
      TracingConfig:
        Mode: Active

  UserLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserLambdaFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com

  AccountLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: account.handler
      FunctionName: accountService
      Description: Account service lambda function
      MemorySize: 128
      PackageType: Zip
      Role: !Ref LambdaExecutionRole
      Environment:
        Variables: 
          USER_LAMBDA_ARN: !GetAtt UserLambdaFunction.Arn
      Code:
        S3Bucket: all-lambda-functions-v1
        S3Key: accountService.zip
      Runtime: nodejs16.x
      Timeout: 25
      TracingConfig:
        Mode: Active

  AccountLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AccountLambdaFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com

  EntriesLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: entriesService.handler
      FunctionName: entriesService
      Description: Entries service lambda function
      MemorySize: 128
      PackageType: Zip
      Role: !Ref LambdaExecutionRole
      Code:
        S3Bucket: all-lambda-functions-v1
        S3Key: entriesService.zip
      Runtime: nodejs16.x
      Timeout: 25
      TracingConfig:
        Mode: Active

  EntriesLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EntriesLambdaFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com

  AuthLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: authService.handler
      FunctionName: authService
      Description: Auth service lambda function
      MemorySize: 128
      PackageType: Zip
      Role: !Ref LambdaExecutionRole
      Environment:
        Variables: 
          USER_LAMBDA_ARN: !GetAtt UserLambdaFunction.Arn
          SECRET_KEY: !Ref SecretKey
          CONNECTION_URL: !Ref ConnectionUrl
      Code:
        S3Bucket: all-lambda-functions-v1
        S3Key: authService.zip
      Runtime: nodejs16.x
      Timeout: 25
      TracingConfig:
        Mode: Active

  AuthLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthLambdaFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com

  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: PersonalFinanceTrackerAPI

  ApiGatewayAuthorizer:
    Type: 'AWS::ApiGateway::Authorizer'
    Properties:
      Name: 'AuthLambdaFunction'
      Type: 'TOKEN'
      AuthorizerUri: 
        !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations
          - LambdaFunctionArn: !GetAtt AuthLambdaFunction.Arn
      IdentitySource: 'method.request.header.Authorization'
      RestApiId: !Ref ApiGatewayRestApi

  UserResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: users
      RestApiId: !Ref ApiGatewayRestApi

  GetUserByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref UserResource
      PathPart: "{userId}"
      RestApiId: !Ref ApiGatewayRestApi

  AddUserResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref UserResource
      PathPart: add
      RestApiId: !Ref ApiGatewayRestApi

  DeleteUserResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref UserResource
      PathPart: delete
      RestApiId: !Ref ApiGatewayRestApi

  DeleteUserByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref DeleteUserResource
      PathPart: "{userId}"
      RestApiId: !Ref ApiGatewayRestApi

  UpdateUserResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref UserResource
      PathPart: update
      RestApiId: !Ref ApiGatewayRestApi

  UpdateUserByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref UpdateUserResource
      PathPart: "{userId}"
      RestApiId: !Ref ApiGatewayRestApi

  UserPDFResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref UserResource
      PathPart: generate-pdf
      RestApiId: !Ref ApiGatewayRestApi

  AccountResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: accounts
      RestApiId: !Ref ApiGatewayRestApi

  GetAccountByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AccountResource
      PathPart: "{accountId}"
      RestApiId: !Ref ApiGatewayRestApi

  AccountAddResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AccountResource
      PathPart: add
      RestApiId: !Ref ApiGatewayRestApi

  AccountDeleteResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AccountResource
      PathPart: delete
      RestApiId: !Ref ApiGatewayRestApi

  AccountDeleteByNoResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AccountDeleteResource
      PathPart: "{accountNo}"
      RestApiId: !Ref ApiGatewayRestApi

  EntriesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: entries
      RestApiId: !Ref ApiGatewayRestApi

  EntriesAddResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref EntriesResource
      PathPart: add
      RestApiId: !Ref ApiGatewayRestApi

  EntriesUpdateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
